name: Build dependencies for Ipe on Windows
on: workflow_dispatch
jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      IPECROSS: x86_64
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt install gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 mingw-w64-tools meson
      - name: Setup
        run: make setup
      - name: Compile zlib
        run: make zlib
      - name: Compile libpng
        run: make libpng
      - name: Compile Freetype
        run: make freetype
      - name: Compile Cairo
        run: make cairo
      - name: Compile lua
        run: make lua
      - name: Compile libspiro
        run: make spiro
      - name: Compile qhull
        run: make qhull
      - name: Compile GSL
        run: make gsl
      - name: View result
        run: ls -R mingwlibs-x86_64
      - name: Create archive
        run: tar czvf mingwlibs-x86_64.tar.gz mingwlibs-x86_64
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: mingwlibs-x86_64
          path: mingwlibs-x86_64.tar.gz
          retention-days: 2
      - run: 'echo "Status ${{ job.status }}"'
